name: release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Read local package version
        id: read-local-version
        run: |
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Read NPM version
        id: read-npm-version
        run: |
          PKG_NAME=$(jq -r .name package.json)
          version=$(pnpm view $PKG_NAME version --registry https://registry.npmjs.org 2>/dev/null || echo "")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if git tag exists
        id: check-tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.read-local-version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install and pack
        if: >-
          steps.read-local-version.outputs.version != steps.read-npm-version.outputs.version ||
          steps.check-tag.outputs.exists == 'false'
        id: pack
        run: |
          pnpm install
          tarball=$(pnpm pack --out package.tgz | tail -n 1)
          echo "tarball=$tarball" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        if: ${{ steps.read-local-version.outputs.version != steps.read-npm-version.outputs.version }}
        run: |
          pnpm publish ${{ steps.pack.outputs.tarball }} --access public --provenance --no-git-checks

      - name: Create GitHub Release
        if: ${{ steps.check-tag.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.read-local-version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          test -f "$TARBALL"
          gh release create "$TAG" "$TARBALL" \
            --target "$GITHUB_SHA" \
            --latest \
            --generate-notes
