name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: "24"

      - name: Install dependencies
        run: pnpm install

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

      - name: Test
        run: pnpm test

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Install solc
        run: |
          curl -sSL https://github.com/ethereum/solidity/releases/download/v0.8.36/solc-static-linux -o "$RUNNER_TEMP/solc"
          echo "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6  $RUNNER_TEMP/solc" | sha256sum -c
          sudo install -m 755 "$RUNNER_TEMP/solc" /usr/local/bin/solc

      - name: Test envelopes
        run: pnpm test:forge
      - name: Gas snapshot
        run: forge snapshot --root test/forge --match-contract GasTest --check --snap test/forge/.gas-snapshot
