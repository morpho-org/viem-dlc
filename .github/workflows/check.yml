name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave GITHUB_TOKEN in the runner's git config.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            playground/pnpm-lock.yaml
          node-version: "24"

      - name: Install dependencies
        run: pnpm install

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm typecheck
      # The playground is a detached pnpm project with its own lockfile.
      - name: Install playground dependencies
        run: pnpm -C playground install --frozen-lockfile
      - name: Typecheck playground
        run: pnpm -C playground typecheck

      - name: Test
        run: pnpm test

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Install solc
        run: |
          curl -sSL https://github.com/ethereum/solidity/releases/download/v0.8.36/solc-static-linux -o "$RUNNER_TEMP/solc"
          echo "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6  $RUNNER_TEMP/solc" | sha256sum -c
          sudo install -m 755 "$RUNNER_TEMP/solc" /usr/local/bin/solc

      - name: Test envelopes
        run: pnpm test:forge
      - name: Gas snapshot
        run: forge snapshot --root test/forge --match-contract GasTest --check --snap test/forge/.gas-snapshot
