packages:
- .

# Minimum age (in minutes) a package version must reach before pnpm will install it.
# 7 days = 10080 minutes, preferred for supply-chain hardening.
minimumReleaseAge: 10080
resolutionMode: time-based

# esbuild is a transitive dependency (via Vitest/Vite/tsx), but pnpm 11 blocks its
# postinstall unless approved, causing ERR_PNPM_IGNORED_BUILDS during install.
allowBuilds:
  esbuild: true

# Advisory fixes for transitive dev dependencies. `resolutionMode: time-based` otherwise pins
# these below their patched versions, since their parents (vitest, @vercel/blob) haven't bumped.
# All are dev-only -- none reach consumers, who only get `dist` plus `valibot`.
# Drop each entry once its parent's own range picks up the patched version.
overrides:
  # GHSA-859w-5945-r5v3 and others; @vercel/blob@2.6.1 still pins 6.24.1
  undici: ^6.28.0
  # server.fs.deny bypasses, path traversal, launch-editor UNC disclosure
  vite: ^7.3.6
  # arbitrary file read, path traversal, XSS via unescaped </style>
  postcss: ^8.5.24
  # ReDoS and method injection via extglob / POSIX character classes
  picomatch: ^4.0.5
